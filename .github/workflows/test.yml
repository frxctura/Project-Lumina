name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Lumina is Windows-only, and some tests use Windows tools (icacls, reg, tar)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the tests
        run: ./gradlew test --console=plain

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
