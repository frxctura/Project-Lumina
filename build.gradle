plugins {
  id 'java'
  id 'application'
  id 'org.javamodularity.moduleplugin' version '1.8.12'
  id 'org.openjfx.javafxplugin' version '0.0.13'
  id 'org.beryx.jlink' version '2.25.0'
}

group 'com.javafxapp'
version '1.4'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.10.0'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

application {
  mainModule = 'com.javafxapp.javafxapp'
  mainClass = 'com.javafxapp.javafxapp.LuminaApp'
}

javafx {
  version = '17.0.6'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
  implementation 'org.slf4j:slf4j-api:2.0.13'
  implementation 'ch.qos.logback:logback-classic:1.5.6'
  implementation 'org.apache.commons:commons-compress:1.24.0'
  implementation 'org.tukaani:xz:1.9'

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
  useJUnitPlatform()
}

jlink {
  options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages', '--bind-services']
  launcher {
    name = 'Lumina'
  }
  jpackage {
    imageOptions = ["--icon", file("src/main/resources/com/javafxapp/javafxapp/images/icon.ico").absolutePath] as List<String>
  }
}

jlinkZip {
  group = 'distribution'
}
tasks.register('installer', Exec) {
  group = 'distribution'
  description = 'Builds build/installer/LuminaSetup-<version>.exe with Inno Setup (ISCC on PATH).'
  dependsOn 'jpackageImage'
  workingDir 'installer'
  commandLine 'ISCC', "/DAppVersion=${project.version}", 'lumina.iss'
}
